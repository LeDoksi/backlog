<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бэклог</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Бэклог</h1>
    <nav id="tabs" class="tabs">
      <button class="tabs__item is-active" data-category="all">Всё <span class="tabs__count" data-count="all"></span></button>
      <button class="tabs__item" data-category="game">Игры <span class="tabs__count" data-count="game"></span></button>
      <button class="tabs__item" data-category="series">Сериалы <span class="tabs__count" data-count="series"></span></button>
      <button class="tabs__item" data-category="movie">Кино <span class="tabs__count" data-count="movie"></span></button>
      <button class="tabs__item" data-category="anime">Аниме <span class="tabs__count" data-count="anime"></span></button>
    </nav>
  </header>

  <section class="toolbar">
    <input id="search-input" class="toolbar__search" type="search" placeholder="Поиск по названию…">
    <select id="status-filter" class="toolbar__select">
      <option value="all">Любой статус</option>
      <option value="queue">В очереди</option>
      <option value="in_progress">В процессе</option>
      <option value="done">Готово</option>
    </select>
    <select id="genre-filter" class="toolbar__select">
      <option value="all">Любой жанр</option>
    </select>
    <label class="toolbar__checkbox">
      <input id="returning-filter" type="checkbox"> Ждут продолжения
    </label>
    <label class="toolbar__checkbox">
      <input id="hide-done-filter" type="checkbox"> Скрыть пройденное
    </label>
    <select id="sort-select" class="toolbar__select">
      <option value="status" selected>Актуальное сначала</option>
      <option value="added">По дате добавления</option>
      <option value="name">По названию</option>
      <option value="year">По году</option>
      <option value="rating">По оценке</option>
    </select>
    <button id="random-pick" class="toolbar__random" type="button" aria-live="polite">
      <svg class="toolbar__random-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
        <rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2.6"/>
        <circle cx="5.6" cy="5.6" r="0.9" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="8" r="0.9" fill="currentColor" stroke="none"/>
        <circle cx="10.4" cy="10.4" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
      <span class="toolbar__random-label">Что посмотреть?</span>
    </button>
  </section>

  <form id="quick-add-form" class="quick-add">
    <input id="quick-add-title" class="quick-add__input" type="text" placeholder="Название нового тайтла…" required>
    <select id="quick-add-category" class="quick-add__select" required>
      <option value="" disabled selected>Категория…</option>
      <option value="game">Игра</option>
      <option value="series">Сериал</option>
      <option value="movie">Кино</option>
      <option value="anime">Аниме</option>
    </select>
    <button type="submit" class="quick-add__submit">+ Добавить</button>
  </form>

  <main id="grid" class="grid"></main>

  <div id="title-modal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal__close" aria-label="Закрыть">×</button>
      <img id="modal-cover" class="modal__cover" alt="">
      <div class="modal__body">
        <h2 id="modal-title" class="modal__title"></h2>
        <p id="modal-meta" class="modal__meta"></p>
        <p id="modal-seasons" class="modal__seasons" hidden></p>
        <p id="modal-synopsis" class="modal__synopsis"></p>
        <div class="modal__field">
          <span class="modal__field-label">Статус</span>
          <div id="modal-status" class="status-buttons" role="group" aria-label="Статус">
            <button type="button" class="status-buttons__btn" data-status="queue" aria-pressed="false">В очереди</button>
            <button type="button" class="status-buttons__btn" data-status="in_progress" aria-pressed="false">В процессе</button>
            <button type="button" class="status-buttons__btn" data-status="done" aria-pressed="false">Готово</button>
          </div>
        </div>
        <div class="modal__field">
          <span class="modal__field-label">Моя оценка</span>
          <div class="rating">
            <div id="modal-rating" class="star-rating" role="group" aria-label="Оценка от 1 до 10">
              <button type="button" class="star-rating__star" data-value="1" aria-label="Оценка 1 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="2" aria-label="Оценка 2 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="3" aria-label="Оценка 3 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="4" aria-label="Оценка 4 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="5" aria-label="Оценка 5 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="6" aria-label="Оценка 6 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="7" aria-label="Оценка 7 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="8" aria-label="Оценка 8 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="9" aria-label="Оценка 9 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
              <button type="button" class="star-rating__star" data-value="10" aria-label="Оценка 10 из 10" aria-pressed="false" tabindex="-1"><span class="star-rating__mark"></span></button>
            </div>
            <span id="modal-rating-readout" class="rating__readout" aria-live="polite"></span>
          </div>
        </div>
        <button id="modal-delete" class="modal__delete">Удалить тайтл</button>
      </div>
    </div>
  </div>

  <script src="lib/slug.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/query.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
