<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бэклог</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d0f14">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Бэклог</h1>
    <nav id="tabs" class="tabs">
      <button class="tabs__item is-active" data-category="all">Всё <span class="tabs__count" data-count="all"></span></button>
      <button class="tabs__item" data-category="game">Игры <span class="tabs__count" data-count="game"></span></button>
      <button class="tabs__item" data-category="series">Сериалы <span class="tabs__count" data-count="series"></span></button>
      <button class="tabs__item" data-category="movie">Кино <span class="tabs__count" data-count="movie"></span></button>
      <button class="tabs__item" data-category="anime">Аниме <span class="tabs__count" data-count="anime"></span></button>
    </nav>
  </header>

  <section class="toolbar">
    <input id="search-input" class="toolbar__search" type="search" placeholder="Поиск по названию…">
    <select id="status-filter" class="toolbar__select" aria-label="Фильтр по статусу">
      <option value="all">Любой статус</option>
      <option value="queue">В бэклоге</option>
      <option value="in_progress">В процессе</option>
      <option value="done">Завершено</option>
      <option value="unreleased">Ещё не вышло</option>
    </select>
    <div id="genre-filter" class="genre-filter">
      <button id="genre-trigger" class="genre-filter__trigger" type="button" aria-expanded="false" aria-controls="genre-panel">
        <span class="genre-filter__name">Жанры</span>
        <span id="genre-count" class="genre-filter__count" hidden></span>
        <svg class="genre-filter__chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M2.5 4.5 6 8l3.5-3.5"/>
        </svg>
      </button>
      <div id="genre-panel" class="genre-filter__panel" hidden>
        <div id="genre-options" class="genre-filter__options" role="group" aria-label="Фильтр по жанрам"></div>
        <div id="genre-footer" class="genre-filter__footer" hidden>
          <button id="genre-reset" class="genre-filter__reset" type="button">Сбросить</button>
        </div>
      </div>
    </div>
    <label class="toolbar__checkbox">
      <input id="returning-filter" type="checkbox"> Всё ещё выходит
    </label>
    <label class="toolbar__checkbox">
      <input id="hide-done-filter" type="checkbox"> Скрыть завершённое
    </label>
    <label class="toolbar__checkbox">
      <input id="drafts-only-filter" type="checkbox"> Только черновики
    </label>
    <select id="sort-select" class="toolbar__select" aria-label="Сортировка">
      <option value="status" selected>Актуальное сначала</option>
      <option value="added">По дате добавления</option>
      <option value="name">По названию</option>
      <option value="year">По году</option>
    </select>
    <button id="random-pick" class="toolbar__random" type="button" aria-live="polite">
      <svg class="toolbar__random-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
        <rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2.6"/>
        <circle cx="5.6" cy="5.6" r="0.9" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="8" r="0.9" fill="currentColor" stroke="none"/>
        <circle cx="10.4" cy="10.4" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
      <span class="toolbar__random-label">Что посмотреть?</span>
    </button>
    <!-- The icon is a miniature of what the panel contains: a track with a fill
         running from its left end — the same meter the stats rows are built from. -->
    <button id="stats-open" class="toolbar__stats" type="button" aria-haspopup="dialog">
      <svg class="toolbar__stats-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <rect x="1.55" y="5.15" width="12.9" height="5.7" rx="2.85" stroke="currentColor" stroke-width="1.5"/>
        <rect x="3.4" y="7" width="4.6" height="2" rx="1" fill="currentColor"/>
      </svg>
      <span>Итоги</span>
    </button>
  </section>

  <div id="genre-chips" class="genre-chips" role="group" aria-label="Выбранные жанры" hidden></div>

  <form id="quick-add-form" class="quick-add">
    <input id="quick-add-title" class="quick-add__input" type="text" placeholder="Название нового тайтла…" required>
    <select id="quick-add-category" class="quick-add__select" required aria-label="Категория нового тайтла">
      <option value="" disabled selected>Категория…</option>
      <option value="game">Игра</option>
      <option value="series">Сериал</option>
      <option value="movie">Кино</option>
      <option value="anime">Аниме</option>
    </select>
    <!-- Task 40/42: searches TMDb/RAWG/Shikimori (by category) live as you type
         and opens #quick-add-picker below with candidates to choose from — see
         wireEnrichPicker in app.js. -->
    <button type="submit" class="quick-add__submit">+ Добавить</button>
  </form>
  <div id="quick-add-picker" class="enrich-picker" hidden>
    <button type="button" class="enrich-picker__close" aria-label="Закрыть результаты поиска">×</button>
    <p class="enrich-picker__message" hidden></p>
    <ul class="enrich-picker__list"></ul>
  </div>

  <main id="grid" class="grid"></main>

  <div id="title-modal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal__close" aria-label="Закрыть">×</button>
      <img id="modal-cover" class="modal__cover" alt="">
      <div class="modal__body">
        <h2 id="modal-title" class="modal__title"></h2>
        <p id="modal-original" class="modal__original" hidden></p>
        <p id="modal-meta" class="modal__meta"></p>
        <p id="modal-seasons" class="modal__seasons" hidden></p>
        <p id="modal-platforms" class="modal__platforms" hidden></p>
        <p id="modal-synopsis" class="modal__synopsis"></p>
        <div class="modal__field">
          <span id="modal-status-label" class="modal__field-label">Статус</span>
          <div id="modal-status" class="status-buttons" role="group" aria-label="Статус">
            <button type="button" class="status-buttons__btn" data-status="queue" aria-pressed="false">В бэклоге</button>
            <button type="button" class="status-buttons__btn" data-status="in_progress" aria-pressed="false">В процессе</button>
            <button type="button" class="status-buttons__btn" data-status="done" aria-pressed="false">Завершено</button>
          </div>
          <!-- Shown instead of the three seats above when a series/anime title
               carries a `parts` list: there the status is derived from what is
               ticked, never set by hand. -->
          <div id="modal-parts" class="parts" hidden>
            <div class="parts__summary">
              <span id="modal-parts-status" class="badge parts__badge"></span>
              <span id="modal-parts-progress" class="parts__progress" aria-live="polite"></span>
            </div>
            <ul id="modal-parts-list" class="parts__list"></ul>
          </div>
        </div>

        <!-- Task 39: full in-UI card editing. "Редактировать" swaps for the
             Сохранить/Отмена pair while the form below is open; every other
             control in the panel (status, delete) keeps working underneath it
             exactly as before. -->
        <button id="modal-edit" class="modal__edit" type="button">Редактировать</button>
        <div id="modal-edit-form" class="edit-form" hidden>
          <label class="edit-form__field">
            <span class="modal__field-label">Название</span>
            <input id="edit-title" class="edit-form__input" type="text">
          </label>
          <label class="edit-form__field">
            <span class="modal__field-label">Оригинальное название</span>
            <input id="edit-original-title" class="edit-form__input" type="text">
          </label>
          <label class="edit-form__field">
            <span class="modal__field-label">Категория</span>
            <select id="edit-category" class="edit-form__select">
              <option value="game">Игра</option>
              <option value="series">Сериал</option>
              <option value="movie">Кино</option>
              <option value="anime">Аниме</option>
            </select>
          </label>
          <label class="edit-form__field">
            <span class="modal__field-label">Год</span>
            <input id="edit-year" class="edit-form__input" type="number">
          </label>
          <label class="edit-form__field">
            <span class="modal__field-label">Жанры (через запятую)</span>
            <input id="edit-genres" class="edit-form__input" type="text">
          </label>
          <div class="edit-form__field">
            <span class="modal__field-label">Обложка</span>
            <div class="edit-form__cover">
              <img id="edit-cover-preview" class="edit-form__cover-preview" alt="">
              <div class="edit-form__cover-inputs">
                <label class="edit-form__cover-label">Ссылка на картинку (URL или путь)
                  <input id="edit-cover" class="edit-form__input" type="text">
                </label>
                <!-- Task 41: reads the file client-side, downscales it on a canvas
                     (max 900px longest edge) and writes the resulting JPEG data URI
                     straight into #edit-cover above — same field Сохранить already
                     diffs/saves, no new storage mechanism. -->
                <label class="edit-form__cover-label">или загрузить файл
                  <input id="edit-cover-file" class="edit-form__file" type="file" accept="image/*">
                </label>
                <p id="edit-cover-error" class="edit-form__error" role="alert" hidden></p>
              </div>
            </div>
          </div>
          <label id="edit-platforms-field" class="edit-form__field">
            <span class="modal__field-label">Платформы (через запятую)</span>
            <input id="edit-platforms" class="edit-form__input" type="text">
          </label>
          <label id="edit-season-info-field" class="edit-form__field">
            <span class="modal__field-label">Сезоны (описание)</span>
            <textarea id="edit-season-info" class="edit-form__textarea" rows="2"></textarea>
          </label>
          <label class="edit-form__field">
            <span class="modal__field-label">Синопсис</span>
            <textarea id="edit-synopsis" class="edit-form__textarea" rows="4"></textarea>
          </label>
          <div id="edit-parts-field" class="edit-form__field">
            <span class="modal__field-label">Сезоны и части</span>
            <ul id="edit-parts-list" class="edit-parts"></ul>
            <button id="edit-parts-add" class="edit-parts__add" type="button">+ Добавить часть</button>
          </div>
          <!-- Task 44: a 4th status, "not yet released" — a checkbox layered on
               top of the plain status buttons (which stay live above this form),
               not a select. Hidden for game and for a parts-checklist-bearing
               title, since the checklist already expresses "hasn't come out
               yet" per-part — see updateEditFieldVisibility in app.js. -->
          <label id="edit-unreleased-field" class="edit-form__field edit-form__checkbox">
            <input id="edit-unreleased" type="checkbox"> Ещё не вышло
          </label>
          <label class="edit-form__field edit-form__checkbox">
            <input id="edit-draft" type="checkbox"> Черновик (требует проверки)
          </label>
          <p id="edit-error" class="edit-form__error" role="alert" hidden></p>
          <div class="edit-form__actions">
            <button id="edit-save" class="edit-form__save" type="button">Сохранить</button>
            <button id="edit-cancel" class="edit-form__cancel" type="button">Отмена</button>
          </div>
        </div>

        <button id="modal-delete" class="modal__delete">Удалить тайтл</button>
      </div>
    </div>
  </div>

  <!-- Итоги. A peer of the title panel, not a child of it: same .modal shell,
       same backdrop, same close button, its own body rendered from scratch on
       every open so the numbers can never be stale. Placed after #title-modal
       so the two never fight over DOM order. -->
  <div id="stats-modal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel modal__panel--stats" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <button id="stats-close" class="modal__close" aria-label="Закрыть">×</button>
      <h2 id="stats-title" class="stats__heading">Итоги</h2>
      <div id="stats-body" class="stats"></div>
    </div>
  </div>

  <!-- The app's one and only external dependency: the Supabase client, which
       carries the realtime websocket that lets two devices see each other's
       edits. Deferred on purpose — it is 200KB from a third-party CDN and
       nothing on screen depends on it, so it must never sit in front of the
       first paint. app.js renders from localStorage immediately and picks this
       up afterwards (see "Синхронизация" in README); if the tag fails outright,
       offline or with the CDN blocked, `window.supabase` is simply undefined
       and BacklogSync.createClient hands back null, which every function in
       lib/sync.js already treats as "local-only today". -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="lib/slug.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/query.js"></script>
  <script src="lib/sync.js"></script>
  <script src="lib/validate.js"></script>
  <script src="lib/enrich.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Registered from the page rather than app.js: this has to survive even
    // if app.js ever fails to load, and it has nothing to do with the app's
    // own state/rendering logic.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
