name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: install
        working-directory: app
        run: npm ci
      - name: unit tests and types
        working-directory: app
        run: npm test && npm run typecheck
      - name: production build and JS budget
        working-directory: app
        run: npm run build && npm run budget
      - name: e2e
        working-directory: app
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: keep failed screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: app/test-results, retention-days: 7 }
      - name: print failed screenshot diffs (temporary)
        if: failure()
        working-directory: app/test-results
        run: for f in $(find . -name '*light-*-diff.png' -o -name '*light-*-actual.png' | sort); do echo "IMG $f"; base64 -w0 "$f"; echo; done
