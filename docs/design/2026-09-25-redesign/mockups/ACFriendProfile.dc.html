        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg></button>

    <div style="display: flex; align-items: center; gap: 16px;">

        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: {{t.muted}};">
          <span><b style="color: {{t.text}}; font-weight: 600;">14</b> общих тайтлов</span>
          <span><b style="color: {{t.text}}; font-weight: 600;">5</b> хотите оба</span>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
        <span style="font-size: 13px; color: {{t.muted}}; margin-right: 2px;">Общие жанры</span>
        <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{t.accentSoft}}; color: {{t.accentText}}; font-size: 13px; font-weight: 600; display: flex; align-items: center;">фэнтези</span>
        <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{t.accentSoft}}; color: {{t.accentText}}; font-size: 13px; font-weight: 600; display: flex; align-items: center;">драма</span>
        <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{t.accentSoft}}; color: {{t.accentText}}; font-size: 13px; font-weight: 600; display: flex; align-items: center;">боевик</span>
      </div>
    </section>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <nav aria-label="Категории" style="display: flex; gap: 6px;">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
          <button type="button" style="white-space: nowrap; flex-shrink: 0; height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font-family: Unbounded, Onest, sans-serif; font-size: 11px; font-weight: 600; {{tab.style}}">{{tab.label}}</button>
        </sc-for>
      </nav>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{posters}}" as="p" hint-placeholder-count="6">
        <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 18px; overflow: hidden; box-shadow: {{t.posterShadow}};">
          <img src="{{p.cover}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          <sc-if value="{{p.common}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; left: 6px; top: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: {{t.accent}}; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center;">общее</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to top, {{t.bg}} 35%, {{t.bgClear}}); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; bottom: 26px; width: 358px; height: 68px;">
    <dc-import name="TabBar" active="friends" dark="{{dark}}" badge="{{no}}" hint-size="358px,68px"></dc-import>
  </div>
</div>
</x-dc>
