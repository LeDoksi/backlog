<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A+C, друзья на телефоне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="padding: 54px 18px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-family: Unbounded, Onest, sans-serif; font-size: 24px; font-weight: 600;">Друзья</h1>
      <button type="button" style="white-space: nowrap; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 0; background: {{t.surface}}; color: {{t.text}}; box-shadow: {{t.softShadow}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="8.5" r="3.8"></circle><path d="M3.5 19.5c.9-3.4 3.4-5.3 6.5-5.3 1.6 0 3 .5 4.1 1.4"></path><path d="M18 14v6M15 17h6"></path></svg>Добавить</button>
    </div>

    <div role="group" aria-label="Раздел" style="display: flex; padding: 5px; gap: 4px; border-radius: 999px; background: {{t.surface}}; box-shadow: {{t.softShadow}};">
      <button type="button" aria-pressed="true" style="white-space: nowrap; flex: 1; height: 38px; border: 0; border-radius: 999px; background: {{t.accent}}; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;">Лента</button>
      <button type="button" aria-pressed="false" style="white-space: nowrap; flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 600;">Совпадения 3</button>
      <button type="button" aria-pressed="false" style="white-space: nowrap; flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 600;">Друзья 3</button>
    </div>

    <section style="padding: 14px; border-radius: 24px; background: {{t.surface}}; box-shadow: {{t.softShadow}}; display: flex; align-items: center; gap: 12px;">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #8ec5ff; color: #14161b; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">К</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 600;">Катя хочет дружить</span>
        <span style="font-size: 12px; color: {{t.muted}};">@katya, совпадение вкусов 64%</span>
      </div>
      <button type="button" aria-label="Отклонить" style="white-space: nowrap; width: 40px; height: 40px; border-radius: 50%; border: 0; background: {{t.sunken}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      <button type="button" style="white-space: nowrap; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: {{t.accent}}; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;">Принять</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.muted}};">Сегодня</h2>
      <div style="padding: 12px 12px 12px 14px; border-radius: 22px; background: {{t.surface}}; box-shadow: {{t.softShadow}}; display: flex; gap: 12px; align-items: center;">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #ef7bb0; color: #14161b; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">Д</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; font-size: 14px; line-height: 1.35;">
          <span><b style="font-weight: 600;">Даша</b> посмотрела 2 сезона «Фрирен»</span>
          <span style="font-size: 12px; color: {{t.muted}};">14:20, общая доска</span>
        </div>
        <img src="../../../../images/covers/frieren-2023.jpg" alt="" style="width: 42px; height: 63px; border-radius: 12px; object-fit: cover; flex-shrink: 0;">
      </div>
      <div style="padding: 12px 14px; border-radius: 22px; background: {{t.surface}}; box-shadow: {{t.softShadow}}; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #7fd18b; color: #14161b; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">В</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; font-size: 14px; line-height: 1.35;">
            <span><b style="font-weight: 600;">Вадим</b> добавил 12 тайтлов</span>
            <span style="font-size: 12px; color: {{t.muted}};">11:05</span>
          </div>
        </div>
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{strip}}" as="p" hint-placeholder-count="6">
            <img src="{{p}}" alt="" style="width: 48px; height: 72px; border-radius: 12px; object-fit: cover;">
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.muted}};">На этой неделе</h2>
      <div style="padding: 12px 12px 12px 14px; border-radius: 22px; background: {{t.surface}}; box-shadow: {{t.softShadow}}; display: flex; gap: 12px; align-items: center;">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #f0c05a; color: #14161b; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">Л</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; font-size: 14px; line-height: 1.35;">
          <span><b style="font-weight: 600;">Лёша</b> завершил «Драйв»</span>
          <span style="font-size: 12px; color: {{t.muted}};">вторник</span>
        </div>
        <img src="../../../../images/covers/drive-2011.jpg" alt="" style="width: 42px; height: 63px; border-radius: 12px; object-fit: cover; flex-shrink: 0;">
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to top, {{t.bg}} 35%, {{t.bgClear}}); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; bottom: 26px; width: 358px; height: 68px;">
    <dc-import name="TabBar" active="friends" dark="{{dark}}" hint-size="358px,68px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#0f1117', bgClear: 'rgba(15,17,23,0)', surface: '#1b1e27', sunken: '#232734', text: '#f1f2f6', muted: '#9ba1b0',
      accent: '#4b66ff', softShadow: 'none'
    } : {
      bg: '#eef0f4', bgClear: 'rgba(238,240,244,0)', surface: '#ffffff', sunken: '#f1f2f6', text: '#14161b', muted: '#5d6270',
      accent: '#3452ff', softShadow: '0 8px 22px -14px rgba(40,50,90,0.45)'
    };
    var strip = ['8882af00bb57f8e973d2d6e61efa7fbf', '0a360cdd76ae256930d3ebfa219dfc47', '514f6bbb89b832ea38dae3ecdb15488c', '6432228812141a5b69c7248072297447', '3fa01358b261ec4a8e08b248bca4f332', '23f94705dd8cc646d61eee2f18aea349'].map(function (id) { return '../../../../images/covers/' + BLOB[id]; });
    return { t: t, dark: dark, strip: strip };
  }
}
</script>
</body>
</html>
