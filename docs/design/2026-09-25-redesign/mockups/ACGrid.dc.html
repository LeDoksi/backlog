<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A+C, сетка на телефоне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="position: absolute; left: -80px; top: -170px; width: 550px; height: 360px; background: radial-gradient(closest-side, {{t.glow}}, rgba(52,82,255,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; padding: 54px 18px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div role="group" aria-label="Доска" style="flex-grow: 1; display: flex; padding: 5px; gap: 4px; border-radius: 999px; background: {{t.surface}}; box-shadow: {{t.softShadow}};">
        <button type="button" aria-pressed="false" style="white-space: nowrap; flex: 1; height: 40px; border: 0; border-radius: 999px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 15px; font-weight: 600;">Моё</button>
        <button type="button" aria-pressed="true" style="white-space: nowrap; flex: 1.4; height: 40px; border: 0; border-radius: 999px; background: {{t.accent}}; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px;">
          <span style="display: inline-flex;">
            <span style="width: 22px; height: 22px; border-radius: 50%; background: #f0a33a; color: #14161b; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px {{t.accent}};">Г</span>
            <span style="width: 22px; height: 22px; border-radius: 50%; background: #ef7bb0; color: #14161b; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px {{t.accent}}; margin-left: -7px;">Д</span>
          </span>
          Общее
        </button>
      </div>
      <button type="button" aria-label="Поиск" style="white-space: nowrap; width: 50px; height: 50px; border-radius: 50%; border: 0; background: {{t.surface}}; color: {{t.text}}; box-shadow: {{t.softShadow}}; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      </button>
    </div>

    <nav aria-label="Категории" style="display: flex; gap: 8px; margin-right: -18px; overflow: hidden;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
        <button type="button" style="white-space: nowrap; flex-shrink: 0; height: 42px; padding: 0 16px; border: 0; border-radius: 999px; font-family: Unbounded, Onest, sans-serif; font-size: 12px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 7px; {{tab.style}}">{{tab.label}}<span style="font-family: Onest, sans-serif; font-size: 12px; font-weight: 600; opacity: 0.6;">{{tab.count}}</span></button>
      </sc-for>
    </nav>

    <div style="display: flex; gap: 8px; margin-right: -18px; overflow: hidden;">
      <button type="button" style="white-space: nowrap; height: 38px; padding: 0 15px 0 11px; border-radius: 999px; border: 0; background: {{t.accentSoft}}; color: {{t.accentText}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="9" cy="9" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="15" cy="15" r="1.4" fill="currentColor" stroke="none"></circle></svg>
        Что посмотреть?
      </button>
      <button type="button" style="white-space: nowrap; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: {{t.surface}}; color: {{t.text2}}; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;">В процессе 7</button>
      <button type="button" style="white-space: nowrap; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: {{t.surface}}; color: {{t.text2}}; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;">Ещё выходит</button>
      <button type="button" style="white-space: nowrap; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: {{t.surface}}; color: {{t.text2}}; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;">Жанры</button>
    </div>
  </div>

  <main style="position: relative; padding: 18px 18px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 22px; overflow: hidden; background: {{t.sunken}}; box-shadow: {{t.posterShadow}};">
          <img src="{{c.cover}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          <div style="position: absolute; left: 8px; top: 8px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; background: {{t.chipOnPoster}}; backdrop-filter: blur(12px); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{c.statusColor}};">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: {{c.statusColor}};"></span>{{c.statusLabel}}
          </div>
          <sc-if value="{{c.hasProgress}}" hint-placeholder-val="{{true}}">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 12px 12px; background: linear-gradient(to top, rgba(12,14,20,0.88), rgba(12,14,20,0));">
              <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; color: #eef0f4; margin-bottom: 6px;"><span>{{c.progressText}}</span><span>{{c.progressRight}}</span></div>
              <div style="height: 5px; border-radius: 5px; background: rgba(255,255,255,0.3);"><div style="height: 5px; border-radius: 5px; width: {{c.pct}}; background: #ffffff;"></div></div>
            </div>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 3px;">
          <div style="font-size: 14px; font-weight: 600; line-height: 1.25;">{{c.title}}</div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
            <span style="font-size: 12px; color: {{t.muted}};">{{c.meta}}</span>
            <sc-if value="{{c.hasFriends}}" hint-placeholder-val="{{false}}">
              <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: {{t.muted}};">
                <span style="width: 18px; height: 18px; border-radius: 50%; background: {{c.friendBg}}; color: #14161b; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">{{c.friendInitial}}</span>{{c.friendText}}
              </span>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-for>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to top, {{t.bg}} 35%, {{t.bgClear}}); pointer-events: none;"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center;">
    <nav aria-label="Разделы" style="flex-grow: 1; height: 68px; padding: 6px; border-radius: 999px; background: {{t.glass}}; backdrop-filter: blur(22px) saturate(160%); border: 1px solid {{t.glassBorder}}; box-shadow: {{t.glassShadow}}; display: flex; gap: 2px;">
      <a href="#" aria-current="page" style="flex: 1; border-radius: 999px; background: {{t.accentSoft}}; color: {{t.accentText}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2.5"></rect><rect x="13" y="4" width="7" height="7" rx="2.5"></rect><rect x="4" y="13" width="7" height="7" rx="2.5"></rect><rect x="13" y="13" width="7" height="7" rx="2.5"></rect></svg>Бэклог</a>
      <a href="#" style="flex: 1; position: relative; border-radius: 999px; color: {{t.muted}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.5"></circle><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"></path><circle cx="17" cy="8" r="2.5"></circle><path d="M16.5 13.2c2.3.3 3.9 1.9 4.5 4.3"></path></svg>Друзья
        <span style="position: absolute; top: 7px; right: 13px; min-width: 17px; height: 17px; border-radius: 9px; background: {{t.badge}}; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span></a>
      <a href="#" style="flex: 1; border-radius: 999px; color: {{t.muted}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>Итоги</a>
      <a href="#" style="flex: 1; border-radius: 999px; color: {{t.muted}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>Профиль</a>
    </nav>
    <button type="button" aria-label="Добавить тайтл" style="white-space: nowrap; width: 68px; height: 68px; flex-shrink: 0; border-radius: 50%; border: 0; background: {{t.accent}}; color: #fff; box-shadow: {{t.fabShadow}}; display: flex; align-items: center; justify-content: center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#0f1117', bgClear: 'rgba(15,17,23,0)', surface: '#1b1e27', sunken: '#232734', text: '#f1f2f6', text2: '#d3d7e0', muted: '#9ba1b0',
      accent: '#4b66ff', accentText: '#b8c3ff', accentSoft: 'rgba(111,134,255,0.2)', glow: 'rgba(75,102,255,0.16)',
      softShadow: 'none', posterShadow: '0 12px 28px -14px rgba(0,0,0,0.85)',
      glass: 'rgba(31,34,48,0.72)', glassBorder: 'rgba(255,255,255,0.1)', glassShadow: 'inset 0 1px 0 rgba(255,255,255,0.07), 0 18px 40px -12px rgba(0,0,0,0.8)',
      fabShadow: '0 16px 30px -12px rgba(75,102,255,0.7)', chipOnPoster: 'rgba(15,17,23,0.74)', badge: '#ff6a4a',
      activeTab: 'background: #f1f2f6; color: #14161b;', tab: 'background: #1b1e27; color: #d3d7e0;',
      st: { queue: '#c3c8d4', progress: '#b8c3ff', done: '#8fd6a4' }
    } : {
      bg: '#eef0f4', bgClear: 'rgba(238,240,244,0)', surface: '#ffffff', sunken: '#e3e6ec', text: '#14161b', text2: '#3b404c', muted: '#5d6270',
      accent: '#3452ff', accentText: '#2b45d8', accentSoft: '#e4e8ff', glow: 'rgba(52,82,255,0.10)',
      softShadow: '0 8px 22px -14px rgba(40,50,90,0.45)', posterShadow: '0 14px 28px -16px rgba(40,50,90,0.6)',
      glass: 'rgba(255,255,255,0.78)', glassBorder: 'rgba(20,22,28,0.07)', glassShadow: 'inset 0 1px 0 rgba(255,255,255,0.9), 0 18px 40px -16px rgba(40,50,90,0.5)',
      fabShadow: '0 16px 30px -12px rgba(52,82,255,0.6)', chipOnPoster: 'rgba(255,255,255,0.9)', badge: '#ff5a36',
      activeTab: 'background: #14161b; color: #ffffff;', tab: 'background: #ffffff; color: #3b404c;',
      st: { queue: '#4b5160', progress: '#2b45d8', done: '#2f7a45' }
    };
    var LABEL = { queue: 'В бэклоге', progress: 'Смотрю', done: 'Завершено' };
    var tabs = [['Всё', 213, true], ['Аниме', 26], ['Кино', 93], ['Сериалы', 35], ['Игры', 31]].map(function (x) {
      return { label: x[0], count: x[1], style: x[2] ? t.activeTab : t.tab };
    });
    var cards = [
      { title: 'Фрирен, провожающая в последний путь', meta: 'Аниме, 2023', cover: '../../../../images/covers/frieren-2023.jpg', st: 'progress', progress: ['Сезон 2 из 3', 'ждём 3-й', '66%'], friend: ['В', '#7fd18b', 'Вадим'] },
      { title: 'Пацаны', meta: 'Сериал, 2019', cover: '../../../../images/covers/the-boys-2019.jpg', st: 'progress', progress: ['4 из 5 сезонов', '', '80%'] },
      { title: "Baldur's Gate 3", meta: 'Игра, 2023', cover: '../../../../images/covers/baldurs-gate-3-2023.jpg', st: 'queue', friend: ['Л', '#f0c05a', 'Лёша'] },
      { title: 'Монолог фармацевта', meta: 'Аниме, 2023', cover: '../../../../images/covers/the-apothecary-diaries-2023.jpg', st: 'queue' },
      { title: 'Человек-паук: Паутина вселенных', meta: 'Кино, 2023', cover: '../../../../images/covers/spider-man-across-the-spider-verse-2023.jpg', st: 'done' },
      { title: 'Clair Obscur: Expedition 33', meta: 'Игра, 2025', cover: '../../../../images/covers/clair-obscur-expedition-33-2025.webp', st: 'queue' }
    ].map(function (c) {
      return {
        title: c.title, meta: c.meta, cover: c.cover,
        statusLabel: LABEL[c.st], statusColor: t.st[c.st],
        hasProgress: !!c.progress,
        progressText: c.progress ? c.progress[0] : '', progressRight: c.progress ? c.progress[1] : '', pct: c.progress ? c.progress[2] : '0%',
        hasFriends: !!c.friend,
        friendInitial: c.friend ? c.friend[0] : '', friendBg: c.friend ? c.friend[1] : '', friendText: c.friend ? c.friend[2] : ''
      };
    });
    return { t: t, tabs: tabs, cards: cards };
  }
}
</script>
</body>
</html>
