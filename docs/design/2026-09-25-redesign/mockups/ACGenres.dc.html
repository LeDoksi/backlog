<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A+C, выбор жанров</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="position: absolute; inset: 0; background: {{t.scrim}};"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="genres-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 330px; border-radius: 32px 32px 0 0; background: {{t.sheet}}; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: {{t.handle}}; align-self: center;"></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h2 id="genres-title" style="margin: 0; font-family: Unbounded, Onest, sans-serif; font-size: 18px; font-weight: 600;">Жанры</h2>
      <span style="font-size: 13px; color: {{t.muted}};">любой из выбранных</span>
    </div>
    <div role="group" aria-label="Жанры" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="14">
        <button type="button" aria-pressed="{{g.pressed}}" style="white-space: nowrap; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; {{g.style}}">{{g.label}}<span style="font-size: 12px; opacity: 0.6;">{{g.n}}</span></button>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: {{t.sheet}}; border-top: 1px solid {{t.line}}; display: flex; gap: 8px;">
    <button type="button" style="white-space: nowrap; flex: 1; height: 54px; border-radius: 20px; border: 0; background: {{t.sunken}}; color: {{t.text}}; font-family: inherit; font-size: 15px; font-weight: 600;">Сбросить</button>
    <button type="button" style="white-space: nowrap; flex: 2; height: 54px; border-radius: 20px; border: 0; background: {{t.accent}}; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;">Показать 58</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#0f1117', scrim: 'rgba(0,0,0,0.6)', sheet: '#171a22', handle: 'rgba(255,255,255,0.2)', sunken: '#232734', line: 'rgba(255,255,255,0.08)',
      text: '#f1f2f6', muted: '#9ba1b0', accent: '#4b66ff', on: 'background: #4b66ff; color: #ffffff;', off: 'background: #232734; color: #d3d7e0;'
    } : {
      bg: '#eef0f4', scrim: 'rgba(20,24,40,0.45)', sheet: '#ffffff', handle: 'rgba(20,22,28,0.16)', sunken: '#f1f2f6', line: 'rgba(20,22,28,0.08)',
      text: '#14161b', muted: '#5d6270', accent: '#3452ff', on: 'background: #3452ff; color: #ffffff;', off: 'background: #f1f2f6; color: #3b404c;'
    };
    var list = [['фэнтези', 34, true], ['драма', 41, true], ['боевик', 52], ['супергероика', 47], ['фантастика', 38], ['комедия', 29], ['приключения', 26], ['триллер', 18], ['ужасы', 12], ['романтика', 11], ['детектив', 9], ['мистика', 8], ['кооператив', 7], ['экшен-RPG', 6]];
    var genres = list.map(function (g) { return { label: g[0], n: g[1], pressed: g[2] ? 'true' : 'false', style: g[2] ? t.on : t.off }; });
    return { t: t, genres: genres };
  }
}
</script>
</body>
</html>
